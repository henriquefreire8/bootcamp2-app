<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokédex Simples</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Pokédex Simples</h1>
  <p>Digite o nome de um Pokémon (em inglês) e clique em Buscar.</p>

  <input type="text" id="campo-busca" placeholder="Ex: pikachu">
  <button id="botao-buscar">Buscar</button>

  <div id="resultado"></div>

  <p id="mensagem" role="status"></p>

  <section>
    <h2>Meu time</h2>
    <div id="time"></div>
  </section>

  <!-- Biblioteca do Supabase (versão UMD: funciona abrindo o arquivo, no GitHub Pages e no Docker) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
</body>
</html>
